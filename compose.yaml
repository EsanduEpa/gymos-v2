services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gymos_development_master
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - gymos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d gymos_development_master"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gymos_postgres:
