services:
  - type: web
    name: gymos-api
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:deploy:api
    startCommand: pnpm start:deploy:api
    healthCheckPath: /
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: 24.22.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MASTER_DATABASE_URL
        sync: false
      - key: TENANT_DATABASE_URL
        sync: false
      - key: PROVISION_DATABASE_URL
        sync: false
      - key: GYMOS_DEPLOY_DATABASE_HOST
        sync: false
      - key: GYMOS_WEB_ORIGIN
        sync: false
      - key: PROVISIONING_RUNNER_ENABLED
        value: 'true'
      - key: PT_EXPIRY_RUNNER_ENABLED
        value: 'true'
